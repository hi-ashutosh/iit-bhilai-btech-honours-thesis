<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400" viewBox="0 0 420 400" role="img"><title>JT on a compact diagram, showing which AP serves which user.</title><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd591c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="210" y="34" font-size="21" fill="#192b40" text-anchor="middle" font-weight="700">Same channel, same message</text><g transform="translate(65,145)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="65" y="202" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">AP 1</text><g transform="translate(355,145)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="355" y="202" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">AP 2</text><rect x="195" y="243" width="30" height="51" rx="6" fill="white" stroke="#192b40" stroke-width="2.5"/><circle cx="210" cy="287" r="2" fill="#192b40"/><text x="210" y="321" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">User 1</text><path d="M88 163 L187 249" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><path d="M332 163 L233 249" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="210" y="366" font-size="18" fill="#56687d" text-anchor="middle" font-weight="400">Both APs serve one user.</text><text x="210" y="95" font-size="17" fill="#2563eb" text-anchor="middle" font-weight="600">Channel 1</text></g></svg>