<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>A user between two APs receives signals from both; coordination changes whether those signals interfere or carry the same message.</title><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd591c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif"><rect x="80" y="141" width="800" height="86" rx="43" fill="#e8eef6"/><rect x="362" y="141" width="236" height="86" rx="43" fill="#d6edf0"/><g transform="translate(70,176)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="70" y="233" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">AP 1</text><g transform="translate(890,176)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="890" y="233" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">AP 2</text><rect x="217" y="157" width="30" height="51" rx="6" fill="white" stroke="#192b40" stroke-width="2.5"/><circle cx="232" cy="201" r="2" fill="#192b40"/><text x="232" y="235" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">User</text><rect x="465" y="157" width="30" height="51" rx="6" fill="white" stroke="#192b40" stroke-width="2.5"/><circle cx="480" cy="201" r="2" fill="#192b40"/><text x="480" y="235" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">User</text><rect x="713" y="157" width="30" height="51" rx="6" fill="white" stroke="#192b40" stroke-width="2.5"/><circle cx="728" cy="201" r="2" fill="#192b40"/><text x="728" y="235" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">User</text><text x="232" y="65" font-size="21" fill="#192b40" text-anchor="middle" font-weight="600">Near one AP</text><text x="480" y="65" font-size="21" fill="#087f8c" text-anchor="middle" font-weight="600">Between the APs</text><text x="728" y="65" font-size="21" fill="#192b40" text-anchor="middle" font-weight="600">Near the other AP</text><path d="M111 169 L209 169" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><path d="M850 169 L752 169" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><path d="M128 125 L454 166" fill="none" stroke="#bd591c" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#o)"/><path d="M832 125 L506 166" fill="none" stroke="#bd591c" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#o)"/><text x="480" y="298" font-size="18" fill="#56687d" text-anchor="middle" font-weight="400">Here, the other AP’s signal can be interference—or part of the useful message.</text></g></svg>