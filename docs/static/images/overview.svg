<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img"><title>Two strategies: RIS panels provide reflected paths; two access points jointly transmit to one user.</title><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd591c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif"><path d="M480 40 V340" stroke="#dbe3ed"/><text x="36" y="48" font-size="17" fill="#087f8c" text-anchor="start" font-weight="700">01</text><text x="76" y="48" font-size="24" fill="#192b40" text-anchor="start" font-weight="700">Shape the signal path</text><g transform="translate(391,230)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="391" y="287" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">Receiver</text><rect x="66" y="202" width="30" height="51" rx="6" fill="white" stroke="#192b40" stroke-width="2.5"/><circle cx="81" cy="246" r="2" fill="#192b40"/><text x="81" y="280" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">Transmitter</text><g transform="translate(239,131) rotate(-12)"><rect x="-22" y="-36" width="44" height="72" rx="3" fill="#d2edf0" stroke="#087f8c" stroke-width="2"/><path d="M-7 -36 V36" stroke="#087f8c"/><path d="M7 -36 V36" stroke="#087f8c"/><path d="M-22 -18 H22" stroke="#087f8c"/><path d="M-22 0 H22" stroke="#087f8c"/><path d="M-22 18 H22" stroke="#087f8c"/></g><path d="M104 224 L350 224" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#b)"/><path d="M99 205 L211 143" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#t)"/><path d="M264 147 L369 197" fill="none" stroke="#087f8c" stroke-width="3" marker-end="url(#t)"/><text x="230" y="270" font-size="18" fill="#56687d" text-anchor="middle" font-weight="400">Direct + reflected paths</text><text x="516" y="48" font-size="17" fill="#2563eb" text-anchor="start" font-weight="700">02</text><text x="556" y="48" font-size="24" fill="#192b40" text-anchor="start" font-weight="700">Coordinate the transmitters</text><g transform="translate(570,170)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="570" y="227" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">AP 1</text><g transform="translate(863,170)" fill="none" stroke="#192b40" stroke-width="3" stroke-linecap="round"><path d="M0 -39 L-23 25 M0 -39 L23 25 M-15 6 H15 M-9 -12 H9 M-30 25 H30"/><circle cy="-44" r="4" fill="#192b40"/><path d="M-13 -53 Q-24 -44 -13 -35 M13 -53 Q24 -44 13 -35" stroke="#2563eb"/></g><text x="863" y="227" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">AP 2</text><rect x="703" y="254" width="30" height="51" rx="6" fill="white" stroke="#192b40" stroke-width="2.5"/><circle cx="718" cy="298" r="2" fill="#192b40"/><text x="718" y="332" font-size="18" fill="#192b40" text-anchor="middle" font-weight="600">One user</text><path d="M587 191 L695 262" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><path d="M847 191 L740 2