<svg xmlns="http://www.w3.org/2000/svg" width="420" height="550" viewBox="0 0 420 550" role="img"><title>Three steps in gated queue service: snapshot waiting data, serve that amount, then switch while new arrivals remain.</title><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd591c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="210" y="32" font-size="22" fill="#192b40" text-anchor="middle" font-weight="700">Serve a snapshot, then switch</text><text x="32" y="102" font-size="20" fill="#192b40" text-anchor="start" font-weight="600">1. Five units waiting</text><rect x="32" y="122" width="254" height="62" rx="9" fill="white" stroke="#bacada"/><rect x="44" y="133" width="34" height="39" rx="4" fill="#2563eb"/><rect x="89" y="133" width="34" height="39" rx="4" fill="#2563eb"/><rect x="134" y="133" width="34" height="39" rx="4" fill="#2563eb"/><rect x="179" y="133" width="34" height="39" rx="4" fill="#2563eb"/><rect x="224" y="133" width="34" height="39" rx="4" fill="#2563eb"/><text x="32" y="245" font-size="20" fill="#192b40" text-anchor="start" font-weight="600">2. Original work leaves</text><rect x="32" y="265" width="254" height="62" rx="9" fill="white" stroke="#bacada"/><rect x="44" y="276" width="34" height="39" rx="4" fill="#087f8c"/><rect x="89" y="276" width="34" height="39" rx="4" fill="#087f8c"/><text x="32" y="355" font-size="17" fill="#087f8c" text-anchor="start" font-weight="400">Arrivals continue during service.</text><text x="32" y="388" font-size="20" fill="#192b40" text-anchor="start" font-weight="600">3. New work remains</text><rect x="32" y="408" width="254" height="62" rx="9" fill="white" stroke="#bacada"/><rect x="44" y="419" width="34" height="39" rx="4" fill="#087f8c"/><rect x="89" y="419" width="34" height="39" rx="4" fill="#087f8c"/><text x="32" y="522" font-size="17" fill="#56687d" text-anchor="start" font-weight="400">Illustration only; counts are schematic.</text></g></svg>