<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img"><title>Gated service: snapshot five waiting units, serve that amount while arrivals continue, then switch to the other queue.</title><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2563eb" stroke-width="1.5"/></marker><marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#087f8c" stroke-width="1.5"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#bd591c" stroke-width="1.5"/></marker></defs><rect width="100%" height="100%" fill="#f6f9fc"/><g font-family="Arial,Helvetica,sans-serif"><text x="36" y="47" font-size="25" fill="#192b40" text-anchor="start" font-weight="700">Serve what was waiting at the start of the turn</text><text x="36" y="80" font-size="19" fill="#56687d" text-anchor="start" font-weight="400">New arrivals keep joining while service takes place.</text><text x="45" y="138" font-size="20" fill="#192b40" text-anchor="start" font-weight="700">1. Take a snapshot</text><rect x="45" y="175" width="220" height="78" rx="10" fill="white" stroke="#b6c6d7"/><rect x="57" y="188" width="28" height="49" rx="4" fill="#2563eb"/><rect x="94" y="188" width="28" height="49" rx="4" fill="#2563eb"/><rect x="131" y="188" width="28" height="49" rx="4" fill="#2563eb"/><rect x="168" y="188" width="28" height="49" rx="4" fill="#2563eb"/><rect x="205" y="188" width="28" height="49" rx="4" fill="#2563eb"/><text x="45" y="291" font-size="18" fill="#56687d" text-anchor="start" font-weight="400">Five units waiting</text><path d="M285 215 L335 215" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="365" y="138" font-size="20" fill="#192b40" text-anchor="start" font-weight="700">2. Serve that amount</text><rect x="365" y="175" width="220" height="78" rx="10" fill="white" stroke="#b6c6d7"/><rect x="377" y="188" width="28" height="49" rx="4" fill="#087f8c"/><rect x="414" y="188" width="28" height="49" rx="4" fill="#087f8c"/><text x="365" y="291" font-size="18" fill="#56687d" text-anchor="start" font-weight="400">Original work leaves</text><path d="M605 215 L655 215" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/><text x="365" y="333" font-size="18" fill="#087f8c" text-anchor="start" font-weight="600">Arrivals during service</text><text x="685" y="138" font-size="20" fill="#192b40" text-anchor="start" font-weight="700">3. Switch users</text><rect x="685" y="175" width="220" height="78" rx="10" fill="white" stroke="#b6c6d7"/><rect x="697" y="188" width="28" height="49" rx="4" fill="#087f8c"/><rect x="734" y="188" width="28" height="49" rx="4" fill="#087f8c"/><text x="685" y="291" font-size="18" fill="#56687d" text-anchor="start" font-weight="400">New work remains</text><text x="36" y="388" font-size="17" fill="#56687d" text-anchor="start" font-weight="400">Illustration of the service rule; block counts are schematic, not simulation results.</text></g></svg>